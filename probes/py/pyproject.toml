[project]
name = "be-test-probe-py"
version = "3.2.11"
description = "The acceptance suite's Python probe (test/probe-py)"
requires-python = ">=3.15,<3.16"
dependencies = ["be-sdk"]

[tool.uv.sources]
be-sdk = { git = "https://github.com/brickKit/be-sdk-python", tag = "v3.0.0a12" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probe_py"]
