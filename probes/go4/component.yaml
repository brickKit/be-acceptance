apiVersion: brickkit/v1
kind: Component

metadata:
  id: test/probe-go4
  name: Go probe (go4)
  version: 3.2.58
  description: "A variant of test/probe-go: the same code under its own component ID, ports and event stream"
  repository: https://github.com/brickKit/be-acceptance

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8604
  extraPorts:
    - name: grpc
      port: 9604
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/probe-go", "migrate"]

local:
  runCommand: [go, -C, ../go, run, .]
  migrationCommand: [go, -C, ../go, run, ., migrate]

events:
  publishes: [test.probe.written.v1, test.probe.noted.v1]
  subscribes: [test.probe.written.v1, test.probe.noted.v1]

configSchema:
  type: object
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, PG_SCHEMA, BUS_URL, IMPLEMENTATION_INSTANCE]
  properties:
    PROBE_NEXT:
      type: string
      description: "the component ID of the probe that call and relay go to; unset: none"
    PROBE_NEXT_URL:
      type: string
      description: "the next probe's user surface: $endpoint:<its ID> (protocol P4.26); unset: no HTTP calls"
    PROBE_NEXT_GRPC_URL:
      type: string
      description: "the next probe's system surface: $endpoint:<its ID>:grpc (protocol P4.26); unset: no gRPC calls"
    PROBE_PEER_STREAM:
      type: string
      description: "the peer probe's event stream to consume (test.probe_go, test.probe_py); unset: none"
    PROBE_GUARD:
      type: boolean
      description: "true: the user routes need a credential and their operation instead of being public; SDK default false"
    PROBE_STEPS_EVERY:
      type: string
      description: "how often the steps singleton runs, for the suite's background work profile (Go since 3.2.30); 0: no such job; a duration (e.g. 2s, 500ms); SDK default 0s"
    PROBE_CRON:
      type: boolean
      description: "true: a cron job with a slot a minute, its runs recorded (Go since 3.2.32); SDK default false"
    PROBE_UNDECLARED_ROUTE:
      type: boolean
      description: "true (with PROBE_GUARD): a route naming an operation the probe does not declare, so the start fails, for the suite's authorization profile (since 3.2.38); SDK default false"
    PROBE_EXTERNAL_URL:
      type: string
      description: "the suite's fake external system the payment goes to (Go since 3.2.41; an external command, be-protocol chapter 13); unset: a payment is never sent"
    PROBE_EXTERNAL_DEDUPE_WINDOW:
      type: string
      description: "the payment's declared dedupe window (Go since 3.2.41); 0: not deduplicated; a duration (e.g. 2s, 500ms); SDK default 0s"
    PROBE_EXTERNAL_LAST_USE:
      type: boolean
      description: "true: the dedupe window counts from the last use (Go since 3.2.41); SDK default false"
    PROBE_EXTERNAL_MAX_PROCESSING:
      type: string
      description: "the payment's declared longest processing time (Go since 3.2.41); 0: not declared; a duration (e.g. 2s, 500ms); SDK default 0s"
    PROBE_EXTERNAL_IRREVOCABLE:
      type: boolean
      description: "the payment is irrevocable: its issue record precedes the send (Go since 3.2.41); SDK default true"
    EXTERNAL_COMMANDS_QUERY_ONLY:
      type: boolean
      description: "true: query the external commands, never send them (the Go SDK, P13.10); SDK default false"
    ALERT_WEBHOOK_URL:
      type: string
    RUN_PROFILE_ACCESS_KEY:
      type: string
    RUN_PROFILE_BUCKET:
      type: string
    RUN_PROFILE_URL:
      type: string
    TIERING_STORE_URL:
      type: string
    TIERING_RESIDENCE_PROBE_ARCHIVE:
      type: string
    TIERING_RETENTION_PROBE_ARCHIVE:
      type: string
    TIERING_ROUTE_PROBE_ARCHIVE:
      type: string
    RUN_PROFILE_REGION:
      type: string
      description: "SDK default us-east-1"
    RUN_PROFILE_SECRET_KEY:
      type: string
      secret: true
    TIERING_BUCKET:
      type: string
      description: "SDK default be-tiering"
    TIERING_COLD_CONCURRENCY:
      type: integer
      description: "SDK default 4"
    TIERING_COLD_SYNC_LIMIT:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 10s"
    TIERING_GRACE:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 604800s"
    TIERING_LIST_DAYS:
      type: integer
      description: "SDK default 90"
    TIERING_WINDOW:
      type: string
      description: "SDK default 0 2 * * *"
    TIERING_WRITE_ACCESS_KEY:
      type: string
    TIERING_READ_ACCESS_KEY:
      type: string
    TIERING_DELETE_ACCESS_KEY:
      type: string
    TIERING_WRITE_SECRET_KEY:
      type: string
      secret: true
    TIERING_READ_SECRET_KEY:
      type: string
      secret: true
    TIERING_DELETE_SECRET_KEY:
      type: string
      secret: true
    LOG_LEVEL:
      type: string
      enum: [debug, info, warn, error]
      description: "SDK default info"
    OTEL_URL:
      type: string
      description: "process-level: the same for every member of a shell"
    STOP_DRAIN_DELAY:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 2s"
    STOP_TIMEOUT:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 30s"
    RECOVERY_PHASE:
      type: string
      enum: [frozen, redelivering, replaying, verifying, read_only]
      description: "process-level: the same for every member of a shell"
    DEPLOYMENT_ID:
      type: string
      description: "process-level: the same for every member of a shell"
    IAM_ISSUER:
      type: string
      description: "process-level: the same for every member of a shell"
    IAM_JWKS_URL:
      type: string
      description: "process-level: the same for every member of a shell"
    AUTHZ_GRPC_URL:
      type: string
      description: "process-level: the same for every member of a shell"
    AUDIT_GRPC_URL:
      type: string
      description: "process-level: the same for every member of a shell"
    SERVICE_TLS_CERT_FILE:
      type: string
      secret: true
      mount: file
      description: "a file path, re-read on rotation"
    SERVICE_TLS_KEY_FILE:
      type: string
      secret: true
      mount: file
      description: "a file path, re-read on rotation"
    SERVICE_TLS_CA_FILE:
      type: string
      secret: true
      mount: file
      description: "a file path, re-read on rotation"
    PG_HOST:
      type: string
    PG_PORT:
      type: integer
      description: "SDK default 5432"
    PG_DATABASE:
      type: string
    PG_USER:
      type: string
    PG_PASSWORD:
      type: string
      secret: true
    PG_SCHEMA:
      type: string
    PG_POOLER_PREPARED:
      type: boolean
      description: "SDK default true"
    PG_STATEMENT_TIMEOUT:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 5s"
    PG_LOCK_TIMEOUT:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 2s"
    PG_IDLE_IN_TX_TIMEOUT:
      type: string
      description: "a duration (e.g. 2s, 500ms); SDK default 10s"
    PG_POOL_FOREGROUND:
      type: integer
      description: "SDK default 8"
    PG_POOL_BACKGROUND:
      type: integer
      description: "SDK default 4"
    BUS_URL:
      type: string
      secret: true
      description: "process-level: the same for every member of a shell"
    IMPLEMENTATION_INSTANCE:
      type: string
    OBJECT_STORE_URL:
      type: string
    OBJECT_STORE_REGION:
      type: string
      description: "SDK default us-east-1"
    OBJECT_STORE_BUCKET:
      type: string
    OBJECT_STORE_PREFIX:
      type: string
    OBJECT_STORE_ACCESS_KEY:
      type: string
    OBJECT_STORE_SECRET_KEY:
      type: string
      secret: true
    BUS_SUBSCRIPTION_CONCURRENCY:
      type: integer
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_USER:
      type: string
    PG_OWNER_PASSWORD:
      type: string
      secret: true
