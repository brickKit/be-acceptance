[project]
name = "be-acceptance-conformance"
version = "0.0.0"
description = "Runs probes and components from outside: the probe tests and the conformance profile"
requires-python = ">=3.15,<3.16"
dependencies = ["be-sdk", "pytest", "pytest-asyncio", "httpx", "asyncpg", "pyyaml", "aioboto3", "pyarrow"]  # aioboto3: the harness provisions and empties buckets; pyarrow: the cold tier's third-party reader (tierread.py)

[tool.uv]
package = false

[tool.uv.sources]
be-sdk = { git = "https://github.com/brickKit/be-sdk-python", tag = "v3.0.0a53" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
