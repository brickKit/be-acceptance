# Deliberately broken builds of conformance/rawstub (build argument BROKEN=<name>). Each breaks
# exactly one rule; the suite's self-test asserts that each fails the cases in must_fail and
# passes every other MUST case of the profiles the suite implements. BROKEN unset or empty = the correct
# stub; an unknown name exits 78 at start.
variants:
  - name: accept-refresh
    breaks: P5.3
    behaviour: the token check accepts typ=refresh as an access token
    must_fail: [CP-AUTH-03]
  - name: healthz-db
    breaks: P1.3
    behaviour: /healthz runs SELECT 1 on PostgreSQL and answers 503 when it fails
    must_fail: [CP-CORE-04]
    also_fails: [CP-CORE-03]
  - name: leak-internal
    breaks: P4.3
    behaviour: an INTERNAL error's body carries the raw error text (the PostgreSQL error and SQLSTATE) in detail
    must_fail: [CP-ERR-03]
  - name: ipv4-only
    breaks: P1.13
    behaviour: every port listens on 0.0.0.0 only; ::1 is refused
    must_fail: [CP-CORE-13]
  - name: readyz-live-db
    breaks: P1.4
    behaviour: /readyz runs SELECT 1 on every call once ready and answers 503 while PostgreSQL is down
    must_fail: [CP-CORE-05]
  - name: no-redact
    breaks: P18.2
    behaviour: log records are written without the personal-data redaction
    must_fail: [CP-OBS-04]
  - name: no-goaway
    breaks: P7.5
    behaviour: the gRPC server sets no MaxConnectionAge; a connection lives for ever
    must_fail: [CP-RPC-05]
  - name: unbounded-pool
    breaks: P10.5
    behaviour: the connection pool ignores PG_POOL_MAX and opens a connection per concurrent request
    must_fail: [CP-DB-03]
  - name: secret-read-once
    breaks: P2.9
    behaviour: PG_PASSWORD_FILE is read once at start; a replaced file is never read again
    must_fail: [CP-DB-06]
  - name: cron-no-claim
    breaks: P14.2
    behaviour: every replica runs each cron slot whether or not its INSERT claimed it
    must_fail: [CP-JOBS-01]
  - name: idem-select-claim
    breaks: P10.9, P13.6
    behaviour: an idempotency key is claimed with a plain SELECT and then an INSERT, not atomically
    must_fail: [CP-IDEM-07]
  - name: no-deadline
    breaks: P3.4, P7.7
    behaviour: no route deadline and no outbound deadline; calls wait for the peer for ever
    must_fail: [CP-OUT-07]
    also_fails: [CP-OUT-02, CP-OUT-05, CP-CORE-08]
  - name: empty-dept-root
    breaks: P6.4
    behaviour: an empty dept_path is read as the root of the department tree
    must_fail: [CP-SCOPE-06]
    also_fails: [CP-SCOPE-10]
  - name: invisible-403
    breaks: P6.6
    behaviour: a read of a record the caller cannot see answers 403 OUT_OF_SCOPE instead of 404
    must_fail: [CP-SCOPE-07]
    also_fails: [CP-SCOPE-10, CP-ERR-02]
  - name: no-ce-id
    breaks: P12 (envelope)
    behaviour: the outbox pump publishes without ce-id and without Nats-Msg-Id
    must_fail: [CP-EVP-01]
    also_fails: [CP-EVP-02, CP-EVP-03]
  - name: select-claim
    breaks: P10.9, P12.1
    behaviour: the outbox pump reads PENDING rows with a plain SELECT, then updates them (no FOR UPDATE SKIP LOCKED)
    must_fail: [CP-EVP-03]
