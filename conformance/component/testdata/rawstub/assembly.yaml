# Project keys of conformance/rawstub (protocol keys: be-protocol schemas/assembly-protocol.schema.json).
id: conformance/rawstub

protocol: "1.0"
language: go                   # not built on an official SDK (P20.2)

conformance:
  fixtures: conformance/fixtures.yaml
  skip: []

domain: conformance
tier: backend

edge_routes:
  - { path: /conformance/rawstub/kinds/**, auth: none }
  - { path: /conformance/rawstub/**, auth: required }

data:
  schema: conformance_rawstub  # the suite replaces it with a random schema on every run
  role: conformance_rawstub_rw

data_scopes:
  - { dimension: owner, column: owner_id,  mode: equals, tables: [notes] }
  - { dimension: org,   column: dept_path, mode: prefix, tables: [notes] }
  - { dimension: kind,  column: kind,      mode: in,     tables: [notes] }

resources:
  - type: conformance.rawstub.note
    table: notes
    view_key: conformance.rawstub.view
    keys: [conformance.rawstub.view, conformance.rawstub.archive]
    dimensions: [owner, org, kind]
    derivation: direct          # no relations: nothing is shared, the ACL branch never applies

permissions:
  - { key: conformance.rawstub.view,   title: 查看便签, type: page }
  - { key: conformance.rawstub.create, title: 新建便签, type: action }
  - { key: conformance.rawstub.archive, title: 归档便签, type: action }
